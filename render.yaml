# Render Blueprint: the API, the React static site and PostgreSQL, all on the free plan.
#
# One-time setup: Render dashboard > New > Blueprint > pick this repository (see README
# section 17). Nothing here deploys on push: the API is image-backed (never auto-deploys) and
# the static site has auto-deploy off. Deploys happen only from the manual GitHub workflow
# .github/workflows/deploy.yml, which calls each service's deploy hook.
#
# For the next assignment, rename the three services/database below and the URLs that
# contain those names (APP_HOSTS, the /api/* rewrite destination, image url).
# No secrets in this file: Render generates SECRET_KEY_BASE and provides DATABASE_URL.

databases:
  - name: incubyte-invoice-db
    plan: free
    region: singapore
    postgresMajorVersion: '16'
    databaseName: incubyte_invoice_production
    user: incubyte_invoice

services:
  - type: web
    name: incubyte-invoice-api
    runtime: image
    image:
      # Pushed by deploy.yml. The package must be public (or add registry credentials).
      url: ghcr.io/lavesh-saluja/incubyte-invoice-api:latest
    plan: free
    region: singapore
    # Free plan has no pre-deploy command, so migrations run at start (single instance only).
    dockerCommand: ./bin/migrate-and-start
    healthCheckPath: /api/health/live
    numInstances: 1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: incubyte-invoice-db
          property: connectionString
      - key: SECRET_KEY_BASE
        generateValue: true
      # The web host too: its /api/* rewrite forwards requests with the browser's Host header.
      - key: APP_HOSTS
        value: incubyte-invoice-api.onrender.com,incubyte-invoice-web.onrender.com
      - key: RAILS_LOG_LEVEL
        value: info
      # The first HR account, created at start when missing (bin/migrate-and-start).
      # Values are entered in the Render dashboard, never committed.
      - key: HR_NAME
        sync: false
      - key: HR_EMAIL
        sync: false
      - key: HR_PASSWORD
        sync: false

  - type: web
    name: incubyte-invoice-web
    runtime: static
    # version.txt lets deploy.yml confirm which commit is live.
    buildCommand: npm ci && npm run build && echo "$RENDER_GIT_COMMIT" > dist/version.txt
    staticPublishPath: ./dist
    autoDeployTrigger: 'off'
    previews:
      generation: 'off'
    # Rules apply top to bottom.
    routes:
      # Same-origin API: the browser calls /api/* on this site and Render forwards it to the API,
      # so the session cookie is first-party (onrender.com subdomains are separate sites).
      - type: rewrite
        source: /api/*
        destination: https://incubyte-invoice-api.onrender.com/api/*
      # Client-side routing: every other unknown path serves the React app.
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: '22'
      # VITE_API_BASE_URL is deliberately unset: the frontend calls /api on its own origin.
